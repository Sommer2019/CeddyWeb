name: Generate env.js and deploy to GitHub Pages

on:
  push: {}
  workflow_dispatch: {}

# Request write permission for repository contents so the action can push
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a token that may be provided via secret (preferred) or default GITHUB_TOKEN
          token: ${{ secrets.PAGES_DEPLOY_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Create env.js from Secrets
        run: |
          echo "// This file is generated by CI. Do not edit in repo." > ./env.js
          echo "window.SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';" >> ./env.js
          echo "window.SUPABASE_PUBLISHABLE_KEY = '${{ secrets.SUPABASE_PUBLISHABLE_KEY }}';" >> ./env.js
          echo "window.CDM_ENV_GENERATED_AT = '${{ github.run_id }}';" >> ./env.js

      - name: Show env.js (for debug only)
        run: |
          echo "---- env.js (first 20 lines) ----"
          head -n 20 env.js || true

      # If you have a build step (e.g. npm run build), run it here before deploy
      # - name: Build
      #   run: npm ci && npm run build

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Prefer a Personal Access Token (PAT) stored in the secret PAGES_DEPLOY_PAT.
          # If the secret is not set, the default GITHUB_TOKEN will be used (may be blocked by repo settings).
          personal_token: ${{ secrets.PAGES_DEPLOY_PAT || secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          # optionally set user/name
          user_name: github-actions
          user_email: actions@github.com


# Notes:
# - If you still get 403 when pushing, create a Personal Access Token (classic) with 'repo' scope
#   (or at least 'repo:contents') and add it as repository Secret named 'PAGES_DEPLOY_PAT'.
# - Alternatively enable 'Allow GitHub Actions to create and approve pull requests' and ensure
#   repository settings allow write by workflows and that branch protection doesn't block it.
# - Do NOT put SUPABASE_SERVICE_ROLE_KEY into env.js. Keep the service key in GH secrets for server-side use only.
