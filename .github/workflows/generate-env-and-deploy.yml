name: Generate env.js and deploy to GitHub Pages

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAGES_DEPLOY_PAT || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Create env.js from Secrets
        run: |
          echo "// This file is generated by CI. Do not edit in repo." > ./env.js
          echo "window.SUPABASE_URL = '${{ secrets.SUPABASE_URL }}';" >> ./env.js
          echo "window.SUPABASE_PUBLISHABLE_KEY = '${{ secrets.SUPABASE_PUBLISHABLE_KEY }}';" >> ./env.js
          echo "window.CDM_ENV_GENERATED_AT = '${{ github.run_id }}';" >> ./env.js

      - name: Show env.js (for debug only)
        run: |
          echo "---- env.js (first 20 lines) ----"
          head -n 20 env.js || true

      - name: Prepare public directory
        run: |
          rm -rf public
          mkdir -p public
          mkdir -p public/votingData
          # Copy root HTML files and static assets only (whitelist)
          cp -v *.html public/ || true
          cp -v CNAME public/ || true
          cp -v 404.html public/ || true
          cp -v env.js public/ || true
          cp -rv css public/ || true
          cp -rv js public/ || true
          cp -rv img public/ || true
          # Copy only JSON data files needed by the client
          cp -v votingData/*.json public/votingData/ || true
          # Remove any accidental server-side files
          rm -f public/api/submit-vote.js || true
          rm -f public/.env || true
          # If you have a build step, run it here and move artifacts into public/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

# Notes:
# - This workflow generates env.js and publishes the contents of ./public to GitHub Pages.
# - If you need to publish a build output (e.g. from npm run build), run that build step and
#   copy the build artifacts into ./public before the upload step.
# - Do NOT put SUPABASE_SERVICE_ROLE_KEY into env.js. Keep the service key in GH secrets for server-side use only.
