<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawedere's Beard Empire | Sidebar Pro</title>
    <style>
        :root {
            --bg-black: #070607;
            --accent: #7C4DFF;
            --muted: #9aa0a6;
            --card-bg: rgba(255, 255, 255, 0.02);
            --box-gradient: linear-gradient(180deg, rgba(124, 77, 255, 0.12), rgba(0, 0, 0, 0.05));
            --box-border: rgba(124, 77, 255, 0.1);
            --panel-bg: #0b0b0d;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-black);
            color: #e6eef8;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Mobile Layout */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
            }
        }

        /* LINKS: DER AVATAR-BEREICH */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px;
            background: radial-gradient(circle at center, #1a1033 0%, #070607 80%);
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            main {
                padding: 20px;
                min-height: 60vh;
            }
        }

        .stats-header { text-align: center; margin-bottom: 20px; }
        .score-big {
            font-size: 4rem;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(to bottom, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(124, 77, 255, 0.4));
        }

        .character-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            margin-top: 20px;
        }

        #avatar-svg {
            width: 100%;
            height: auto;
            max-height: 75vh;
            filter: drop-shadow(0 15px 40px rgba(0,0,0,0.6));
            transition: transform 0.05s;
        }
        #avatar-svg:active { transform: scale(0.97); }

        /* RECHTS: DER SCHMALE SHOP */
        aside {
            width: 260px; /* Schmaler gemacht */
            background: var(--panel-bg);
            border-left: 1px solid var(--box-border);
            display: flex;
            flex-direction: column;
            padding: 20px 15px;
            box-shadow: -10px 0 40px rgba(0,0,0,0.6);
        }

        @media (max-width: 768px) {
            aside {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--box-border);
                box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
                max-height: 40vh;
            }
        }

        aside h2 {
            color: var(--accent);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 0 15px 0;
            opacity: 0.8;
        }

        .shop-list { flex: 1; overflow-y: auto; }
        .shop-list::-webkit-scrollbar { width: 3px; }
        .shop-list::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--box-border);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .item-card.disabled {
            opacity: 0.2;
            filter: grayscale(1);
            cursor: not-allowed;
            pointer-events: none;
        }

        .item-card:hover:not(.disabled) {
            background: rgba(124, 77, 255, 0.08);
            border-color: var(--accent);
        }

        .item-icon {
            font-size: 20px;
            min-width: 35px;
            height: 35px;
            background: var(--box-gradient);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-info { flex: 1; min-width: 0; }
        .item-name { font-weight: 700; display: block; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-cost { color: var(--accent); font-weight: bold; font-size: 0.75rem; }
        .item-count { font-size: 1rem; font-weight: 900; color: var(--muted); opacity: 0.3; }

        .particle {
            position: fixed;
            color: #fff;
            font-weight: 900;
            pointer-events: none;
            text-shadow: 0 0 8px var(--accent);
            animation: particleUp 0.6s ease-out forwards;
            z-index: 100;
        }
        @keyframes particleUp {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-70px); opacity: 0; }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        /* Respect user's motion preferences */
        @media (prefers-reduced-motion: reduce) {
            .particle,
            #event-display,
            #avatar-svg {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <main>
        <div class="stats-header">
            <h1 class="score-big" id="score-display">0</h1>
            <p id="cps-display" style="color: var(--muted); font-size: 0.9rem; margin: 5px 0 0 0;">Barthaare: 0 / s</p>
            <div id="event-display" style="display: none; margin-top: 10px; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; animation: pulse 1s infinite;"></div>
            <div id="combo-display" style="display: none; margin-top: 5px; color: #FFD700; font-weight: bold; font-size: 0.9rem;"></div>
        </div>

        <div class="character-container" onclick="doClick(event)">
            <svg id="avatar-svg" viewBox="0 0 100 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Kopf -->
                <rect x="30" y="30" width="40" height="35" rx="6" fill="#d4a373" />
                
                <!-- CAP (SNAPBACK) -->
                <g id="cap">
                    <!-- Schirm -->
                    <rect x="25" y="32" width="50" height="5" rx="2" fill="#7C4DFF" />
                    <!-- Krone -->
                    <path d="M30 32 L70 32 L70 25 Q 50 15 30 25 Z" fill="#7C4DFF" />
                    <!-- Kleiner Knopf oben -->
                    <circle cx="50" cy="18" r="2" fill="#5c38cc" />
                </g>

                <!-- Brille -->
                <g stroke="#111" stroke-width="1.2" fill="none">
                    <rect x="34" y="42" width="10" height="7" rx="1" />
                    <rect x="56" y="42" width="10" height="7" rx="1" />
                    <path d="M44 46 h12" />
                </g>
                <!-- Augen -->
                <circle cx="39" cy="45" r="1" fill="#000" />
                <circle cx="61" cy="45" r="1" fill="#000" />

                <!-- DYNAMISCHER BART -->
                <path id="beard-path" d="M30 60 Q 50 60 70 60 L 70 65 Q 50 65 30 65 Z" fill="#3d2b1f" />
            </svg>
        </div>
    </main>

    <aside>
        <h2>Bart-Shop</h2>
        <div class="shop-list" id="item-list">
            <!-- Items kommen per JS -->
        </div>
    </aside>

    <!-- Load config.js first for Supabase configuration -->
    <script src="../js/config.js"></script>
    <!-- Load Supabase client -->
    <script src="../js/supabase-client.js"></script>

    <script>
        // Register Service Worker for offline support
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js').then(reg => {
                console.log('Service Worker registered for offline support');
            }).catch(err => {
                console.log('Service Worker registration failed:', err);
            });
        }
        
        let energy = 0;
        let totalEver = 0;
        let cps = 0;
        let userIpHash = null;
        let isLoadingGame = true;
        let clickPower = 1; // Base click power
        let activeEvent = null; // Current active event
        let eventEndTime = 0;
        let comboCount = 0; // Combo counter
        let lastClickTime = 0;
        let lastSaveTime = Date.now(); // Track when we last saved for offline progress
        let needsSync = false; // Track if local changes need syncing to Supabase

        // Game balance constants
        const COMBO_WINDOW_MS = 500; // Time window for combo clicks
        const COMBO_BONUS_PER_HIT = 0.1; // 10% bonus per combo
        const MAX_COMBO_MULTIPLIER = 0.4; // Max 40% bonus (1.4x total)
        const RANDOM_EVENT_CHANCE = 0.02; // 2% chance per click
        const AUTO_ANIMATION_CHANCE = 0.2; // 20% chance per tick
        const AUTO_ANIMATION_MIN_CPS = 1; // Min CPS to show animations
        const PARTICLE_DURATION_MS = 600; // Match CSS animation
        const LOCAL_STORAGE_KEY = 'bart_clicker_game_state'; // LocalStorage key
        const AUTO_SYNC_INTERVAL = 30000; // Sync to Supabase every 30 seconds when online

        const shopItems = [
            { id: 0, name: "Bart-Kamm", cost: 15, cps: 0.1, icon: "🪮", type: "passive" },
            { id: 1, name: "WLAN-Bartöl", cost: 100, cps: 1, icon: "💧", type: "passive" },
            { id: 2, name: "Energy Drink", cost: 500, cps: 4, icon: "⚡", type: "passive" },
            { id: 3, name: "Loot-Lama", cost: 2500, cps: 12, icon: "🦙", type: "passive" },
            { id: 4, name: "Sektenschwur", cost: 12000, cps: 45, icon: "🐑", type: "passive" },
            { id: 5, name: "Dampf-Pflege", cost: 60000, cps: 180, icon: "⚙️", type: "passive" },
            { id: 6, name: "Bart-Fabrik", cost: 250000, cps: 800, icon: "🏭", type: "passive" },
            { id: 7, name: "Starker Griff", cost: 50, clickPower: 1, icon: "💪", type: "click" },
            { id: 8, name: "Bart-Verstärker", cost: 500, clickPower: 5, icon: "🔥", type: "click" },
            { id: 9, name: "Mega-Klicker", cost: 5000, clickPower: 25, icon: "⚡", type: "click" },
            { id: 10, name: "Göttlicher Touch", cost: 50000, clickPower: 100, icon: "✨", type: "click" }
        ].map(item => ({ ...item, count: 0 }));

        // Random events that can trigger
        const randomEvents = [
            { 
                name: "Doppel-Power!", 
                icon: "✨", 
                effect: "clickMultiplier", 
                value: 2, 
                duration: 15000,
                color: "#FFD700"
            },
            { 
                name: "Goldener Bart!", 
                icon: "💰", 
                effect: "clickMultiplier", 
                value: 3, 
                duration: 10000,
                color: "#FFD700"
            },
            { 
                name: "Turbo-Haare!", 
                icon: "🚀", 
                effect: "cpsMultiplier", 
                value: 2, 
                duration: 20000,
                color: "#00FF00"
            },
            { 
                name: "Glücks-Klick!", 
                icon: "🍀", 
                effect: "clickMultiplier", 
                value: 5, 
                duration: 8000,
                color: "#00FF00"
            },
            { 
                name: "Mega-Wachstum!", 
                icon: "🌟", 
                effect: "cpsMultiplier", 
                value: 3, 
                duration: 15000,
                color: "#FF6B6B"
            }
        ];

        // Get user's IP address and hash it
        async function getUserIpHash() {
            if (userIpHash) return userIpHash;
            
            try {
                // Get IP from ipify service
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const ip = data.ip;
                
                // Hash the IP using SHA-256
                const msgBuffer = new TextEncoder().encode(ip);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                
                userIpHash = hashHex;
                return userIpHash;
            } catch (error) {
                console.error('Error getting IP hash:', error);
                // Fallback to a localStorage-based ID for consistency across sessions
                if (!localStorage.getItem('bart_session_id')) {
                    // Use crypto.randomUUID() for a more robust unique identifier
                    const uniqueId = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2) + Date.now().toString(36);
                    localStorage.setItem('bart_session_id', uniqueId);
                }
                userIpHash = localStorage.getItem('bart_session_id');
                return userIpHash;
            }
        }

        // Load game state from Supabase
        // Load game state - try localStorage first, then Supabase
        async function loadGameState() {
            try {
                const ipHash = await getUserIpHash();
                
                // First, try to load from localStorage (works offline)
                const localData = loadFromLocalStorage();
                if (localData) {
                    // Calculate offline progress
                    const offlineProgress = calculateOfflineProgress(localData);
                    
                    // Restore game state
                    energy = parseFloat(localData.energy) || 0;
                    totalEver = parseFloat(localData.total_ever) || 0;
                    
                    // Add offline earnings
                    if (offlineProgress > 0) {
                        energy += offlineProgress;
                        totalEver += offlineProgress;
                        showOfflineProgressMessage(offlineProgress);
                    }
                    
                    // Restore shop items
                    if (localData.shop_items && Array.isArray(localData.shop_items)) {
                        localData.shop_items.forEach((savedItem) => {
                            const item = shopItems.find(i => i.id === savedItem.id);
                            if (item) {
                                item.count = savedItem.count || 0;
                                item.cost = savedItem.cost || item.cost;
                            }
                        });
                    }
                    
                    recalcCps();
                    updateUI();
                    console.log('Game state loaded from localStorage');
                    
                    // Mark for sync if we had offline progress
                    if (offlineProgress > 0) {
                        needsSync = true;
                    }
                }
                
                // Then try to sync with Supabase (if online)
                try {
                    const supabase = await getSupabaseClient();
                    const { data, error } = await supabase
                        .from('bart_clicker_game_state')
                        .select('*')
                        .eq('ip_hash', ipHash)
                        .single();
                    
                    if (error && error.code !== 'PGRST116') {
                        console.log('Supabase not available, using localStorage only');
                    } else if (data) {
                        // Compare timestamps - use newer data
                        const localTime = localData?.last_updated ? new Date(localData.last_updated).getTime() : 0;
                        const supabaseTime = data.last_updated ? new Date(data.last_updated).getTime() : 0;
                        
                        if (supabaseTime > localTime) {
                            console.log('Supabase data is newer, using it');
                            // Supabase data is newer, use it
                            energy = parseFloat(data.energy) || 0;
                            totalEver = parseFloat(data.total_ever) || 0;
                            
                            if (data.shop_items && Array.isArray(data.shop_items)) {
                                data.shop_items.forEach((savedItem) => {
                                    const item = shopItems.find(i => i.id === savedItem.id);
                                    if (item) {
                                        item.count = savedItem.count || 0;
                                        item.cost = savedItem.cost || item.cost;
                                    }
                                });
                            }
                            
                            recalcCps();
                            updateUI();
                            // Save to localStorage for offline use
                            saveToLocalStorage();
                        } else {
                            console.log('Local data is newer or equal, syncing to Supabase');
                            // Local data is newer, sync to Supabase
                            await syncToSupabase();
                        }
                    }
                } catch (error) {
                    console.log('Running in offline mode:', error.message);
                }
            } catch (error) {
                console.error('Error loading game state:', error);
            } finally {
                isLoadingGame = false;
                lastSaveTime = Date.now();
            }
        }
        
        // Calculate offline progress based on CPS
        function calculateOfflineProgress(savedState) {
            if (!savedState || !savedState.last_updated) return 0;
            
            const lastSaved = new Date(savedState.last_updated).getTime();
            const now = Date.now();
            const offlineSeconds = (now - lastSaved) / 1000;
            
            // Cap offline time at 24 hours
            const maxOfflineSeconds = 24 * 60 * 60;
            const cappedSeconds = Math.min(offlineSeconds, maxOfflineSeconds);
            
            // Calculate CPS from saved state
            let savedCps = 0;
            if (savedState.shop_items && Array.isArray(savedState.shop_items)) {
                savedState.shop_items.forEach((savedItem) => {
                    const item = shopItems.find(i => i.id === savedItem.id);
                    if (item && item.type === "passive") {
                        savedCps += (savedItem.count || 0) * item.cps;
                    }
                });
            }
            
            return savedCps * cappedSeconds;
        }
        
        // Show offline progress message
        function showOfflineProgressMessage(progress) {
            if (progress < 1) return;
            
            const hours = Math.floor(progress / 3600 / 1);
            const minutes = Math.floor((progress / 60) % 60);
            
            let timeText = '';
            if (hours > 0) {
                timeText = `${hours}h ${minutes}m`;
            } else if (minutes > 0) {
                timeText = `${minutes}m`;
            } else {
                timeText = 'kurze Zeit';
            }
            
            // Show notification
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white;
                padding: 30px 40px;
                border-radius: 15px;
                font-size: 1.5rem;
                font-weight: bold;
                text-align: center;
                z-index: 10000;
                box-shadow: 0 10px 40px rgba(0,0,0,0.5);
                animation: fadeIn 0.5s ease-out;
            `;
            notification.innerHTML = `
                <div style="font-size: 3rem; margin-bottom: 10px;">🎉</div>
                <div>Willkommen zurück!</div>
                <div style="font-size: 1.2rem; margin-top: 10px;">Du warst ${timeText} offline</div>
                <div style="font-size: 2rem; color: #FFD700; margin-top: 15px;">+${Math.floor(progress).toLocaleString()} Barthaare!</div>
            `;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 1s';
                setTimeout(() => notification.remove(), 1000);
            }, 4000);
        }
        
        // Save to localStorage (works offline)
        function saveToLocalStorage() {
            try {
                const gameState = {
                    energy: energy,
                    total_ever: totalEver,
                    shop_items: shopItems.map(item => ({
                        id: item.id,
                        count: item.count,
                        cost: item.cost
                    })),
                    last_updated: new Date().toISOString()
                };
                
                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(gameState));
                lastSaveTime = Date.now();
                needsSync = true; // Mark that we need to sync to Supabase
            } catch (error) {
                console.error('Error saving to localStorage:', error);
            }
        }
        
        // Load from localStorage
        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                if (saved) {
                    return JSON.parse(saved);
                }
            } catch (error) {
                console.error('Error loading from localStorage:', error);
            }
            return null;
        }
        
        // Sync to Supabase (when online)
        async function syncToSupabase() {
            if (!needsSync) return;
            
            try {
                const ipHash = await getUserIpHash();
                const supabase = await getSupabaseClient();
                
                const gameState = {
                    ip_hash: ipHash,
                    energy: energy,
                    total_ever: totalEver,
                    shop_items: shopItems.map(item => ({
                        id: item.id,
                        count: item.count,
                        cost: item.cost
                    })),
                    last_updated: new Date().toISOString()
                };
                
                // Use upsert to handle both insert and update
                const { error } = await supabase
                    .from('bart_clicker_game_state')
                    .upsert(gameState, { onConflict: 'ip_hash' });
                
                if (error) {
                    console.error('Error syncing to Supabase:', error);
                } else {
                    console.log('Game state synced to Supabase');
                    needsSync = false;
                    // Update localStorage with synced timestamp
                    saveToLocalStorage();
                }
            } catch (error) {
                console.error('Error syncing to Supabase:', error);
            }
        }

        // Save game state (localStorage immediately, Supabase periodically)
        async function saveGameState() {
            if (isLoadingGame) return; // Don't save while loading
            
            // Always save to localStorage (works offline)
            saveToLocalStorage();
            
            // Try to sync to Supabase if online
            if (navigator.onLine) {
                await syncToSupabase();
            }
        }
        
        // Save game state synchronously for beforeunload
        function saveGameStateSync() {
            if (isLoadingGame || !userIpHash) return;
            
            // Save to localStorage immediately
            saveToLocalStorage();
            
            // Try to trigger sync (may not complete before page unloads)
            if (navigator.onLine) {
                syncToSupabase();
            }
        }

        function createShop() {
            const container = document.getElementById('item-list');
            shopItems.forEach((item, i) => {
                const itemType = item.type === "click" ? "Klick-Upgrade" : "Auto-Produzent";
                const itemEffect = item.type === "click" 
                    ? `+${item.clickPower} pro Klick` 
                    : `+${item.cps.toFixed(1)}/s`;
                
                container.innerHTML += `
                    <div class="item-card disabled" id="card-${i}" onclick="buyItem(${i})" title="${itemType}: ${itemEffect}">
                        <div class="item-icon">${item.icon}</div>
                        <div class="item-info">
                            <span class="item-name">${item.name}</span>
                            <span class="item-cost" id="cost-${i}">${item.cost}</span>
                        </div>
                        <div class="item-count" id="count-${i}">0</div>
                    </div>
                `;
            });
        }

        function doClick(e) {
            const now = Date.now();
            
            // Combo system - clicks within COMBO_WINDOW_MS count as combo
            if (now - lastClickTime < COMBO_WINDOW_MS) {
                comboCount++;
            } else {
                comboCount = 1;
            }
            lastClickTime = now;
            
            // Calculate click value with power and event multipliers
            let clickValue = clickPower;
            if (activeEvent && activeEvent.effect === "clickMultiplier") {
                clickValue *= activeEvent.value;
            }
            
            // Combo bonus: +10% per combo hit (max 40% = 1.4x)
            if (comboCount > 1) {
                const comboBonus = Math.min((comboCount - 1) * COMBO_BONUS_PER_HIT, MAX_COMBO_MULTIPLIER);
                clickValue *= (1 + comboBonus);
            }
            
            energy += clickValue;
            totalEver += clickValue;
            showParticle(e.clientX, e.clientY, clickValue);
            updateUI();
            updateComboDisplay();
            
            // Chance to trigger random event
            if (Math.random() < RANDOM_EVENT_CHANCE && !activeEvent) {
                triggerRandomEvent();
            }
        }
        
        function updateComboDisplay() {
            const comboEl = document.getElementById('combo-display');
            if (comboCount > 1) {
                const actualBonus = Math.min((comboCount - 1) * COMBO_BONUS_PER_HIT, MAX_COMBO_MULTIPLIER);
                const bonusPercent = Math.round(actualBonus * 100);
                comboEl.style.display = 'block';
                comboEl.innerText = `🔥 COMBO x${comboCount}! (+${bonusPercent}%)`;
            } else {
                comboEl.style.display = 'none';
            }
        }
        
        function triggerRandomEvent() {
            const event = randomEvents[Math.floor(Math.random() * randomEvents.length)];
            activeEvent = event;
            eventEndTime = Date.now() + event.duration;
            
            const eventEl = document.getElementById('event-display');
            eventEl.style.display = 'block';
            // Convert hex to rgba for better browser compatibility
            const hexToRgba = (hex, alpha) => {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            };
            eventEl.style.backgroundColor = hexToRgba(event.color, 0.2);
            eventEl.style.border = `2px solid ${event.color}`;
            eventEl.style.color = event.color;
            eventEl.innerText = `${event.icon} ${event.name}`;
            
            // Auto-hide after duration
            setTimeout(() => {
                if (Date.now() >= eventEndTime) {
                    activeEvent = null;
                    eventEl.style.display = 'none';
                }
            }, event.duration);
        }

        // Save game state when user leaves the page
        window.addEventListener('beforeunload', () => {
            saveGameStateSync();
        });

        function showParticle(x, y, value = 1) {
            const p = document.createElement('div');
            p.className = 'particle';
            const displayValue = value >= 10 ? Math.floor(value) : value.toFixed(1);
            p.innerText = `+${displayValue}`;
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            
            // Special color for big values
            if (value >= 10) {
                p.style.color = '#FFD700';
                p.style.fontSize = '1.5rem';
            }
            
            document.body.appendChild(p);
            setTimeout(() => p.remove(), PARTICLE_DURATION_MS);
        }

        function buyItem(i) {
            if (energy >= shopItems[i].cost) {
                energy -= shopItems[i].cost;
                shopItems[i].count++;
                shopItems[i].cost = Math.floor(shopItems[i].cost * 1.15);
                recalcCps();
                updateUI();
                saveGameState();
                
                // Visual feedback - shake the avatar
                const avatar = document.getElementById('avatar-svg');
                avatar.style.animation = 'shake 0.3s';
                setTimeout(() => { avatar.style.animation = ''; }, 300);
            }
        }

        function recalcCps() {
            // Calculate passive income
            cps = shopItems
                .filter(item => item.type === "passive")
                .reduce((acc, item) => acc + (item.count * item.cps), 0);
            
            // Calculate click power
            clickPower = 1 + shopItems
                .filter(item => item.type === "click")
                .reduce((acc, item) => acc + (item.count * item.clickPower), 0);
            
            // Update display
            let cpsText = `Barthaare: ${cps.toFixed(1)} / s`;
            if (clickPower > 1) {
                cpsText += ` | Klick: ${clickPower.toFixed(0)}`;
            }
            document.getElementById('cps-display').innerText = cpsText;
        }

        function updateUI() {
            document.getElementById('score-display').innerText = Math.floor(energy).toLocaleString();

            // Shop status & Grey out logic
            shopItems.forEach((item, i) => {
                const card = document.getElementById(`card-${i}`);
                document.getElementById(`cost-${i}`).innerText = item.cost.toLocaleString();
                document.getElementById(`count-${i}`).innerText = item.count;
                
                if (energy >= item.cost) card.classList.remove('disabled');
                else card.classList.add('disabled');
            });

            // Beard growth logic - based on current energy so it shrinks when spending
            const beard = document.getElementById('beard-path');
            const growth = Math.sqrt(energy) * 1.6; // Bart wächst/schrumpft basierend auf aktueller Energie
            const startY = 60;
            const endY = startY + growth;
            
            const pathData = `
                M 30 ${startY} 
                Q 50 ${startY + 3} 70 ${startY} 
                L 70 ${endY} 
                Q 50 ${endY + 12 + growth/10} 30 ${endY} 
                Z
            `;
            beard.setAttribute('d', pathData);

            if(energy > 5000) beard.setAttribute('fill', '#7C4DFF');
            else beard.setAttribute('fill', '#3d2b1f');
        }

        setInterval(() => {
            if (cps > 0) {
                let passiveGain = cps / 10;
                
                // Apply event multiplier if active
                if (activeEvent && activeEvent.effect === "cpsMultiplier") {
                    passiveGain *= activeEvent.value;
                }
                
                energy += passiveGain;
                totalEver += passiveGain;
                
                // Show auto-click animation occasionally
                if (cps >= AUTO_ANIMATION_MIN_CPS && Math.random() < AUTO_ANIMATION_CHANCE) {
                    showAutoClickAnimation();
                }
                
                updateUI();
            }
        }, 100);
        
        function showAutoClickAnimation() {
            const avatar = document.getElementById('avatar-svg');
            const rect = avatar.getBoundingClientRect();
            
            // Random position around the avatar
            const x = rect.left + Math.random() * rect.width;
            const y = rect.top + Math.random() * rect.height;
            
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = "✨";
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            p.style.fontSize = '1.2rem';
            document.body.appendChild(p);
            setTimeout(() => p.remove(), PARTICLE_DURATION_MS);
        }

        createShop();
        
        // Load game state on startup
        loadGameState().then(() => {
            updateUI();
            
            // Set up localStorage auto-save every 10 seconds
            setInterval(() => {
                saveToLocalStorage();
            }, 10000);
            
            // Set up Supabase sync every 30 seconds (when online)
            setInterval(() => {
                if (navigator.onLine && needsSync) {
                    syncToSupabase();
                }
            }, AUTO_SYNC_INTERVAL);
        });
        
        // Handle page visibility changes (tab switching, minimizing)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Tab became hidden - save state
                console.log('Tab hidden, saving state...');
                saveToLocalStorage();
                if (navigator.onLine) {
                    syncToSupabase();
                }
            } else {
                // Tab became visible - calculate offline progress
                console.log('Tab visible, calculating offline progress...');
                const localData = loadFromLocalStorage();
                if (localData && cps > 0) {
                    const offlineProgress = calculateOfflineProgress(localData);
                    if (offlineProgress > 0) {
                        energy += offlineProgress;
                        totalEver += offlineProgress;
                        updateUI();
                        showOfflineProgressMessage(offlineProgress);
                        saveToLocalStorage();
                        if (navigator.onLine) {
                            syncToSupabase();
                        }
                    }
                }
            }
        });
        
        // Handle online/offline events
        window.addEventListener('online', () => {
            console.log('Back online! Syncing to Supabase...');
            if (needsSync) {
                syncToSupabase();
            }
        });
        
        window.addEventListener('offline', () => {
            console.log('Offline mode - using localStorage only');
        });
    </script>
</body>
</html>
